server {
  listen 80;
  listen [::]:80;
  root /usr/share/nginx/html;

  # Map models: real 404s (the UI falls back to a grid), long cache.
  location /maps/ {
    types { model/gltf-binary glb; }
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400";
  }

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SPA routes (/live/:id, /replay/:id)
  location / {
    try_files $uri /index.html;
  }
}
